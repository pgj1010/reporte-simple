_schema-version: "3.2"
ID: reporte-simple
version: 1.0.0
description: Reporte de conexiones y vuelos (RAP ZMAKS_SB_CONEXIONES)

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build

modules:
  - name: reporte-simple-srv
    type: nodejs
    path: gen/srv
    properties:
      NODE_ENV: production
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1G
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: custom
      commands: []
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: reporte-simple-uaa
      - name: reporte-simple-destination
      - name: reporte-simple-connectivity

resources:
  # R3 / D53: rol Visualizador.
  - name: reporte-simple-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: reporte-simple-${org}-${space}
        tenant-mode: dedicated

  # D55: instancias propias. S4_BACKEND es una destination del subaccount (regla técnica 11).
  - name: reporte-simple-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: reporte-simple-srv-api
                Type: HTTP
                URL: ~{srv-api/srv-url}
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true

  - name: reporte-simple-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
