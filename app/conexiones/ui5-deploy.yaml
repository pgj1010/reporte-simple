# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# Build para el HTML5 Application Repository (D54). ui5.yaml queda solo para desarrollo local.
specVersion: "4.0"
metadata:
  name: conexiones
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: conexiones
        relativePaths: true
        additionalFiles:
          - xs-app.json
